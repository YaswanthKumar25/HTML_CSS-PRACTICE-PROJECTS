<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />
    <style>
      body {
        background: linear-gradient(375deg, #1cc7d0, #2ede98);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        padding-top: 50px;
        padding-bottom: 50px;
        border-radius: 10px;
      }
      .profile img {
        border-radius: 50%;
        background-color: linear-gradient(375deg, #1cc7d0, #2ede98);
        border: 5px solid #1cc7d0;
        width: 200px;
      }
      .name {
        font-size: 30px;
        margin-top: 10px;
        font-weight: 600;
      }
      .dec {
        width: 200px;
        text-align: center;
        margin-top: 5px;
        font-weight: 450;
      }
      i {
        padding: 10px;
        background-color: #2ede98;
        color: white;
        font-size: larger;
        text-align: center;
        border-radius: 50%;
        margin-right: 10px;
        margin-top: 10px;
      }
      ul {
        text-align: center;
        margin-right: 15px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="profile"><img src="./img/profile.jpeg" alt="" /></div>
      <div class="name">Yaswanth Kumar</div>
      <div class="dec">
        User interface designer and Python Fullstack developer
      </div>
      <ul>
        <a href="#"><i class="fab fa-facebook"></i></a>
        <a href="#"><i class="fab fa-twitter"></i></a>
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-youtube"></i></a>
      </ul>
    </div>
  </body>
</html>
